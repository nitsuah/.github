name: Risk guard

# LEGACY ONLY — do not copy or rely on this caller-owned check for enforcement.
# A PR can add a same-named GitHub Actions job and spoof its required status.
# Use the ruleset-bound .github/workflows/required-risk-guard.yml from nitsuah/.github instead.
# Rollout and plan requirements: imps/RISK-GUARD.md. This file remains for migration history.
#
# The pull_request job is only a bootstrap check: it is loaded from the PR branch and is not
# trusted against workflow edits. After this file reaches the default branch, the pull_request_target
# event loads the trusted base-branch version. Require "Trusted guard / Risk guard" in branch
# protection; do not require the bootstrap check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  bootstrap:
    name: Bootstrap (untrusted)
    if: github.event_name == 'pull_request'
    uses: nitsuah/.github/.github/workflows/risk-guard.yml@REPLACE_WITH_KIT_SHA # main
    permissions:
      contents: read
      pull-requests: read

  guard:
    name: Trusted guard
    if: github.event_name == 'pull_request_target'
    uses: nitsuah/.github/.github/workflows/risk-guard.yml@REPLACE_WITH_KIT_SHA # main
    permissions:
      contents: read
      pull-requests: read
