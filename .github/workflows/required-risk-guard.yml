name: Required risk guard

# This workflow is intended to be selected directly by a GitHub ruleset's
# "Require workflows to pass before merging" rule. Unlike a caller-owned
# Actions status check, GitHub binds the requirement to this source workflow.
# Never replace this with a same-named job in a target repository.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  risk-guard:
    if: github.repository != 'nitsuah/.github'
    name: Evaluate trusted PR metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out this trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nitsuah/.github
          ref: ${{ github.workflow_sha }}
          path: .risk-guard-kit
          persist-credentials: false

      - name: Run the shared guard against the pull request metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          GUARD_PR: ${{ github.event.pull_request.number }}
          GUARD_OWNERS: ${{ github.event.pull_request.base.repo.owner.login }}
        run: node .risk-guard-kit/imps/ci-guard.mjs
