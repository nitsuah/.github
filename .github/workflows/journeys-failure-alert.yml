name: Journeys failure alert

# workflow_run only fires for workflows in this repository, so the PR (if any) lives here too.
on:
  workflow_run:
    workflows: ["Journeys kit"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && startsWith(github.event.workflow_run.head_branch, 'dependabot/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment on the Dependabot PR
        uses: actions/github-script@v7
        env:
          # Untrusted values go through env, never into script or shell source.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.HEAD_BRANCH || '';
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 5 });
            const pr = prs.find((p) => p.user?.login === 'dependabot[bot]' && p.head?.ref === branch);
            if (!pr) { core.info(`No open Dependabot PR for ${branch}; nothing to do.`); return; }
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: `⚠️ **Journeys failed** on this Dependabot PR.\n\nWorkflow run: ${process.env.RUN_URL}\n\nCheck the logs: this may be a flaky journey or a real regression from the dependency update.`,
            });
