name: Auto update branch

on:
  schedule:
    - cron: '15 * * * *'  # every hour at :15
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_IMPS_TOKEN: ${{ secrets.IMPS_GITHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Warn when cross-repository token is missing
        if: env.HAS_IMPS_TOKEN != 'true'
        run: echo '::warning::Set IMPS_GITHUB_TOKEN with pull-request read/write access to the target repositories.'
      - name: Update dirty PR branches
        if: env.HAS_IMPS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.IMPS_GITHUB_TOKEN }}
        run: node imps/auto-update-branch.mjs nitsuah/motor-pool nitsuah/vigil nitsuah/ats-fill nitsuah/fire nitsuah/gcp nitsuah/stash nitsuah/security-program
        working-directory: ${{ github.workspace }}